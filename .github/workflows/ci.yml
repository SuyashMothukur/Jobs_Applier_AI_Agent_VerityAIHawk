name: Python CI

on:
  push:
  pull_request:
    types: [opened, synchronize, reopened]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v3
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Prepare test data folder
        run: |
          if [ ! -f data_folder/secrets.yaml ]; then
            cp -r data_folder_example data_folder
          fi

      - name: Run tests
        run: pytest tests/ -q